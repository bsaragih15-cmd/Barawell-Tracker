<!-- @dsCard group="Components" viewport="700x760" name="Journey" subtitle="Status chips · step timeline · supply meter · weight-trend chart" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
</head>
<body style="margin:0;padding:20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel" data-presets="react-classic">
window.__dsReady.then((NS) => {
const { StatusChip, StepTimeline, SupplyMeter, TrendChart } = NS;
function Demo() {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, alignItems: "start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <StatusChip status="in_review" />
          <StatusChip status="approved" />
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <StatusChip status="needs_info" />
          <StatusChip status="rejected" />
        </div>
        <SupplyMeter totalDays={28} remainingDays={19} />
        <SupplyMeter totalDays={28} remainingDays={5} refillDate="15 Juli 2026" />
      </div>
      <StepTimeline steps={[
        { title: "Isi kuis kesehatan", description: "±5 menit, gratis", state: "done" },
        { title: "Dokter meninjau jawabanmu", meta: "Balasan dalam 1×24 jam", state: "current" },
        { title: "Rencana & harga transparan", state: "upcoming" },
        { title: "Pengiriman diskret tiap bulan", state: "upcoming" },
      ]} />
    </div>
    <TrendChart
      points={[{ value: 82, label: "M1" }, { value: 81.6 }, { value: 81.9 }, { value: 80.8, label: "M4" }, { value: 80.2 }, { value: 79.5 }, { value: 79.6 }, { value: 78.8, label: "M8" }]}
      goalNote="−3,2 kg sejak mulai — dokter melihat trennya, bukan angka harian."
    />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
});
</script>
</body>
</html>
