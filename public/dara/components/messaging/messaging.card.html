<!-- @dsCard group="Components" viewport="700x300" name="Messaging" subtitle="Doctor–patient thread bubbles" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
</head>
<body style="margin:0;padding:20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel" data-presets="react-classic">
window.__dsReady.then((NS) => {
const { MessageBubble } = NS;
function Demo() {
  return (
    <div style={{ maxWidth: 440, display: "flex", flexDirection: "column", gap: 12 }}>
      <MessageBubble from="doctor" author="dr. Ratna Wijaya" text="Halo Sari. Aku sudah tinjau jawabanmu — sebelum menyetujui resep, boleh tahu tekanan darah terakhirmu?" time="09.14" />
      <MessageBubble from="patient" text="Halo dok, terakhir cek 110/80 bulan lalu." time="09.20" />
      <MessageBubble from="doctor" author="dr. Ratna Wijaya" text="Aman. Resepmu aku setujui ya — detail rencananya sudah bisa dilihat di akunmu." time="09.26" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
});
</script>
</body>
</html>
