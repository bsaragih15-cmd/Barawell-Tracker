<!DOCTYPE html>
<html lang="id">

<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

      <div style={{ maxWidth: 340 }}>
        <Button size="lg" fullWidth>Mulai kuis kesehatan</Button>
